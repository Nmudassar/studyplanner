<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pomodoro Settings | StudySmart</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="assets/css/01-global.css" />

    <!-- Shared sidebar and components -->
    <link rel="stylesheet" href="assets/css/02-component.css" />

    <!-- Pomodoro page CSS -->
    <link rel="stylesheet" href="assets/css/10-pomodoro.css" />

    <!-- Responsive CSS must load last -->
    <link rel="stylesheet" href="assets/css/03-responsive.css" />

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/62d2ea7a17.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <!-- ==================================================
         Mobile Hamburger Button
    =================================================== -->

    <button
      type="button"
      class="mobile-menu-btn"
      id="menuBtn"
      aria-label="Open navigation menu"
      aria-controls="sidebar"
      aria-expanded="false"
    >
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- ==================================================
         Mobile Sidebar Overlay
    =================================================== -->

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- ==================================================
         Page Layout
    =================================================== -->

    <div class="layout">
      <!-- ==================================================
           Shared Sidebar
      =================================================== -->

      <aside class="sidebar" id="sidebar">
        <!-- Sidebar Logo -->

        <div class="logo-details">
          <a href="02-dashboard.html" class="logo">
            <i class="fa-solid fa-graduation-cap"></i>

            <div class="logo-name">Study<span>Smart</span></div>
          </a>

          <!-- Mobile Close Button -->

          <button
            type="button"
            class="sidebar-close-btn"
            id="sidebarCloseBtn"
            aria-label="Close navigation menu"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Sidebar Navigation -->

        <nav aria-label="Pomodoro settings navigation">
          <ul class="nav-list">
            <!-- Search -->

            <li class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>

              <input
                type="search"
                id="sidebarSearch"
                placeholder="Search..."
                aria-label="Search navigation"
                autocomplete="off"
              />
            </li>

            <!-- Dashboard -->

            <li class="nav-item">
              <a href="02-dashboard.html">
                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>
              </a>
            </li>

            <!-- Calendar -->

            <li class="nav-item">
              <a href="07-calendar.html">
                <i class="fa-regular fa-calendar"></i>

                <span>Calendar</span>
              </a>
            </li>

            <!-- Activities Dropdown -->

            <li class="nav-dropdown">
              <button
                type="button"
                class="dropdown-btn"
                id="activitiesBtn"
                aria-expanded="false"
                aria-controls="activitiesMenu"
              >
                <span class="dropdown-left">
                  <i class="fa-solid fa-chart-line"></i>

                  <span>Activities</span>
                </span>

                <i class="fa-solid fa-chevron-down arrow"></i>
              </button>

              <ul class="submenu" id="activitiesMenu">
                <li>
                  <a href="03-subjects.html">
                    <i class="fa-solid fa-book"></i>

                    <span>Subjects</span>
                  </a>
                </li>

                <li>
                  <a href="05-tasks.html">
                    <i class="fa-solid fa-list-check"></i>

                    <span>Tasks</span>
                  </a>
                </li>
              </ul>
            </li>

            <!-- Focus Timer -->

            <li class="nav-item">
              <a
                href="11-pomodoro-settings.html"
                class="active"
                aria-current="page"
              >
                <i class="fa-solid fa-hourglass-half"></i>

                <span>Focus Timer</span>
              </a>
            </li>

            <!-- FAQ -->

            <li class="nav-item">
              <a href="10-faq.html">
                <i class="fa-solid fa-circle-question"></i>

                <span>FAQ</span>
              </a>
            </li>

            <!-- About Us -->

            <li class="nav-item">
              <a href="08-about.html">
                <i class="fa-solid fa-circle-info"></i>

                <span>About Us</span>
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <!-- ==================================================
           Main Pomodoro Content
      =================================================== -->

      <main class="main-content">
        <section class="setting-container">
          <h1>Pomodoro Settings</h1>

          <p>
            Set your preferred focus and break durations for the Pomodoro
            technique.
          </p>

          <!-- Settings Grid -->

          <div class="settings-grid">
            <!-- Focus Time -->

            <div class="setting-card">
              <label for="focusTime"> Focus Time </label>

              <select id="focusTime">
                <option value="25">25 Minutes</option>
                <option value="30">30 Minutes</option>
                <option value="45">45 Minutes</option>
                <option value="60">60 Minutes</option>
              </select>
            </div>

            <!-- Short Break -->

            <div class="setting-card">
              <label for="shortBreak"> Short Break </label>

              <select id="shortBreak">
                <option value="5">5 Minutes</option>
                <option value="10">10 Minutes</option>
                <option value="15">15 Minutes</option>
              </select>
            </div>

            <!-- Long Break -->

            <div class="setting-card">
              <label for="longBreak"> Long Break </label>

              <select id="longBreak">
                <option value="20">20 Minutes</option>
                <option value="25">25 Minutes</option>
                <option value="30">30 Minutes</option>
              </select>
            </div>

            <!-- Long Break Interval -->

            <div class="setting-card">
              <label for="interval"> Long Break Interval </label>

              <select id="interval">
                <option value="2">2 Sessions</option>
                <option value="4" selected>4 Sessions</option>
                <option value="6">6 Sessions</option>
              </select>
            </div>
          </div>

          <!-- Alert Sound -->

          <div class="sound-box">
            <label for="alertSound">
              <input type="checkbox" id="alertSound" checked />

              <span>Enable Alert Sound</span>
            </label>
          </div>

          <!-- Buttons -->

          <div class="button-group">
            <button type="button" class="save-btn" id="savePomodoro">
              Save
            </button>

            <button type="button" class="cancel-btn" id="cancelPomodoro">
              Cancel
            </button>
          </div>
        </section>
      </main>
    </div>

    <!-- ==================================================
         JavaScript
    =================================================== -->

    <!-- Shared sidebar JavaScript -->
    <script src="assets/js/dashboard.js"></script>

    <!-- Pomodoro JavaScript -->
    <script src="assets/js/pomodoro-setting.js"></script>
  </body>
</html>
