<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up | StudySmart</title>

    <!-- CSS Files -->

    <link rel="stylesheet" href="assets/css/01-global.css" />

    <link rel="stylesheet" href="assets/css/05-login.css" />

    <!-- Font Awesome -->

    <script
      src="https://kit.fontawesome.com/62d2ea7a17.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div class="wrapper">
      <!-- Page Title -->

      <h1 id="title">Sign Up</h1>

      <form>
        <!-- First Name -->

        <div class="signup-field">
          <i class="fa-solid fa-user"></i>

          <input
            type="text"
            name="firstname"
            id="firstname-input"
            placeholder="Firstname"
          />
        </div>

        <!-- Email -->

        <div>
          <i class="fa-solid fa-envelope"></i>

          <input
            type="email"
            name="email"
            id="email-input"
            placeholder="Email"
          />
        </div>

        <!-- Password -->

        <div>
          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            name="password"
            id="password-input"
            placeholder="Password"
          />
        </div>

        <!-- Repeat Password -->

        <div class="signup-field">
          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            name="repeat-password"
            id="repeat-password-input"
            placeholder="Repeat Password"
          />
        </div>

        <!-- Buttons -->

        <div class="btn-field">
          <button type="button" id="signupBtn">Sign Up</button>

          <button type="button" id="loginBtn" class="disable">Login</button>
        </div>
      </form>

      <!-- Reset Password Section -->

      <dialog id="resetDialog">
        <h2>Reset Password</h2>

        <p>Enter your registered email address.</p>

        <input type="email" id="resetEmail" placeholder="Enter your email" />

        <div class="dialog-buttons">
          <button type="button" id="sendResetBtn">Send Reset Email</button>

          <button type="button" id="closeResetBtn">Cancel</button>
        </div>
      </dialog>

      <!-- Lost Password Link -->

      <p>
        Lost password?

        <a href="#" id="resetPassword"> Click here </a>
      </p>
    </div>

    <!-- JavaScript -->

    <script src="assets/js/login.js"></script>
  </body>
</html>
