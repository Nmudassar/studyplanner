<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login or Sign Up | StudySmart</title>

    <!-- CSS Files -->
    <link rel="stylesheet" href="assets/css/01-global.css" />
    <link rel="stylesheet" href="assets/css/05-login.css" />
    <link rel="stylesheet" href="assets/css/03-responsive.css" />
    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/62d2ea7a17.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <main class="wrapper">
      <!-- Page Title -->
      <h1 id="title">Sign Up</h1>

      <!-- Login and Sign Up Form -->
      <form id="authForm" novalidate>
        <!-- First Name: only shown during Sign Up -->
        <div class="input-field signup-field">
          <i class="fa-solid fa-user"></i>

          <input
            type="text"
            name="firstname"
            id="firstname-input"
            placeholder="First name"
            autocomplete="given-name"
          />
        </div>

        <!-- Email: shown for both Login and Sign Up -->
        <div class="input-field">
          <i class="fa-solid fa-envelope"></i>

          <input
            type="email"
            name="email"
            id="email-input"
            placeholder="Email"
            autocomplete="email"
            required
          />
        </div>

        <!-- Password: shown for both Login and Sign Up -->
        <div class="input-field">
          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            name="password"
            id="password-input"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
        </div>

        <!-- Repeat Password: only shown during Sign Up -->
        <div class="input-field signup-field">
          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            name="repeat-password"
            id="repeat-password-input"
            placeholder="Repeat password"
            autocomplete="new-password"
          />
        </div>

        <!-- Form Buttons -->
        <div class="btn-field">
          <button type="button" id="signupBtn">Sign Up</button>

          <button type="button" id="loginBtn" class="disable">Login</button>
        </div>
      </form>

      <!-- Lost Password Link -->
      <p class="lost-password">
        Lost password?

        <a href="#" id="resetPassword"> Click here </a>
      </p>

      <!-- Back to Home -->
      <p class="back-home">
        <a href="index.html">
          <i class="fa-solid fa-arrow-left"></i>
          Back to home
        </a>
      </p>
    </main>

    <!-- Reset Password Dialog -->
    <dialog id="resetDialog">
      <div class="dialog-content">
        <h2>Reset Password</h2>

        <p>Enter your registered email address.</p>

        <div class="input-field">
          <i class="fa-solid fa-envelope"></i>

          <input
            type="email"
            id="resetEmail"
            placeholder="Enter your email"
            autocomplete="email"
          />
        </div>

        <div class="dialog-buttons">
          <button type="button" id="sendResetBtn">Send Reset Email</button>

          <button type="button" id="closeResetBtn">Cancel</button>
        </div>
      </div>
    </dialog>

    <!-- JavaScript -->
    <script src="assets/js/login.js"></script>
  </body>
</html>
