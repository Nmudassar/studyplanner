<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calendar | StudySmart</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="assets/css/01-global.css" />

    <!-- Shared Components -->
    <link rel="stylesheet" href="assets/css/02-component.css" />

    <!-- Calendar Page CSS -->
    <link rel="stylesheet" href="assets/css/11-calendar.css" />

    <!-- Responsive CSS must load last -->
    <link rel="stylesheet" href="assets/css/03-responsive.css" />

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/62d2ea7a17.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <!-- ==================================================
         Mobile Hamburger Button
    =================================================== -->

    <button
      type="button"
      class="mobile-menu-btn"
      id="menuBtn"
      aria-label="Open navigation menu"
      aria-controls="sidebar"
      aria-expanded="false"
    >
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- ==================================================
         Mobile Sidebar Overlay
    =================================================== -->

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- ==================================================
         Page Layout
    =================================================== -->

    <div class="layout">
      <!-- ==================================================
           Shared Sidebar
      =================================================== -->

      <aside class="sidebar" id="sidebar">
        <!-- Sidebar Logo -->

        <div class="logo-details">
          <a href="02-dashboard.html" class="logo">
            <i class="fa-solid fa-graduation-cap"></i>

            <div class="logo-name">Study<span>Smart</span></div>
          </a>

          <!-- Mobile Close Button -->

          <button
            type="button"
            class="sidebar-close-btn"
            id="sidebarCloseBtn"
            aria-label="Close navigation menu"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Sidebar Navigation -->

        <nav aria-label="Calendar navigation">
          <ul class="nav-list">
            <!-- Search -->

            <li class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>

              <input
                type="search"
                id="sidebarSearch"
                placeholder="Search..."
                aria-label="Search navigation"
                autocomplete="off"
              />
            </li>

            <!-- Dashboard -->

            <li class="nav-item">
              <a href="02-dashboard.html">
                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>
              </a>
            </li>

            <!-- Calendar -->

            <li class="nav-item">
              <a href="07-calendar.html" class="active" aria-current="page">
                <i class="fa-regular fa-calendar"></i>

                <span>Calendar</span>
              </a>
            </li>

            <!-- Activities Dropdown -->

            <li class="nav-dropdown">
              <button
                type="button"
                class="dropdown-btn"
                id="activitiesBtn"
                aria-expanded="false"
                aria-controls="activitiesMenu"
              >
                <span class="dropdown-left">
                  <i class="fa-solid fa-chart-line"></i>

                  <span>Activities</span>
                </span>

                <i class="fa-solid fa-chevron-down arrow"></i>
              </button>

              <ul class="submenu" id="activitiesMenu">
                <li>
                  <a href="03-subjects.html">
                    <i class="fa-solid fa-book"></i>

                    <span>Subjects</span>
                  </a>
                </li>

                <li>
                  <a href="05-tasks.html">
                    <i class="fa-solid fa-list-check"></i>

                    <span>Tasks</span>
                  </a>
                </li>
              </ul>
            </li>

            <!-- Focus Timer -->

            <li class="nav-item">
              <a href="11-pomodoro-settings.html">
                <i class="fa-solid fa-hourglass-half"></i>

                <span>Focus Timer</span>
              </a>
            </li>

            <!-- FAQ -->

            <li class="nav-item">
              <a href="10-faq.html">
                <i class="fa-solid fa-circle-question"></i>

                <span>FAQ</span>
              </a>
            </li>

            <!-- About Us -->

            <li class="nav-item">
              <a href="08-about.html">
                <i class="fa-solid fa-circle-info"></i>

                <span>About Us</span>
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <!-- ==================================================
           Main Calendar Content
      =================================================== -->

      <main class="main-content">
        <section class="calendar-page">
          <!-- Calendar Header -->

          <header class="calendar-page-header">
            <div>
              <h1>Study Calendar</h1>

              <p>View your automatically generated study sessions.</p>
            </div>

            <div class="calendar-actions">
              <a href="03-subjects.html" class="btn">
                <i class="fa-solid fa-calendar-plus"></i>

                <span>Add Study Plan</span>
              </a>

              <button
                type="button"
                class="clear-plans-button"
                id="clearAllPlansButton"
              >
                <i class="fa-solid fa-trash"></i>

                <span>Clear All Plans</span>
              </button>
            </div>
          </header>

          <!-- Calendar Controls -->

          <div class="calendar-controls">
            <button
              type="button"
              class="calendar-control-button"
              id="previousWeekButton"
              aria-label="Show previous week"
            >
              <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div>
              <h2 id="calendarMonthTitle">Study Schedule</h2>

              <p id="calendarWeekRange"></p>
            </div>

            <button
              type="button"
              class="calendar-control-button"
              id="nextWeekButton"
              aria-label="Show next week"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>

          <!-- Weekly Calendar -->

          <div class="week-calendar" id="weekCalendar">
            <!-- JavaScript creates the seven days here -->
          </div>

          <!-- Empty Calendar Message -->

          <div class="calendar-empty-state" id="calendarEmptyState" hidden>
            <i class="fa-regular fa-calendar"></i>

            <h2>No study sessions yet</h2>

            <p>Choose a subject and generate your first study plan.</p>

            <a href="03-subjects.html" class="btn"> Create Study Plan </a>
          </div>

          <!-- Calendar Summary -->

          <div class="calendar-summary" id="calendarSummary">
            <!-- JavaScript adds the summary here -->
          </div>
        </section>
      </main>
    </div>

    <!-- ==================================================
         JavaScript
    =================================================== -->

    <!-- Shared Sidebar JavaScript -->
    <script src="assets/js/dashboard.js"></script>

    <!-- Calendar JavaScript -->
    <script src="assets/js/calendar.js"></script>
  </body>
</html>
