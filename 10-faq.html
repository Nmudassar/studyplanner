<!-- ==========================================
     FAQ Page
========================================== -->

<section class="faq-page">
  <!-- ==========================================
       FAQ Header
  ========================================== -->

  <header class="faq-header">
    <!-- Left side -->

    <div class="faq-title">
      <p class="faq-tag">Help Centre</p>

      <h1>Frequently Asked Questions</h1>

      <p class="faq-description">
        Find answers to common questions about StudySmart and learn how to use
        the application.
      </p>
    </div>

    <!-- Right side -->

    <div class="faq-icon">
      <i class="fa-solid fa-circle-question"></i>
    </div>
  </header>

  <!-- ==========================================
       Search Bar
  ========================================== -->

  <section class="faq-search-section">
    <label for="faqSearch"> Search Questions </label>

    <div class="faq-search">
      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="search"
        id="faqSearch"
        placeholder="Search FAQ..."
        autocomplete="off"
      />
    </div>
  </section>

  <!-- ==========================================
       FAQ Questions Start Here
  ========================================== -->

  <section class="faq-list" id="faqList"></section>
</section>
